# Numi · Nginx = servidor web de los frontends + proxy inverso de los backends
#   https://numi-g01.northcentralus.cloudapp.azure.com        -> panel administrativo
#   https://numi-g01.northcentralus.cloudapp.azure.com:8443   -> panel docente
#   http (80 y 8080) solo redirige a https

server_tokens off;

upstream admin_api {
    zone admin_api 64k;
    resolver 127.0.0.11 valid=10s ipv6=off;
    server admin-backend:5000 resolve;
}

upstream docente_api {
    zone docente_api 64k;
    resolver 127.0.0.11 valid=10s ipv6=off;
    server docente-backend:5001 resolve;
}

# ---------- HTTP: redirecciones ----------
server {
    listen 80;
    server_name _;
    # Reto HTTP-01 de Let's Encrypt (renovación del certificado)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 8080;
    server_name _;
    return 301 https://$host:8443$request_uri;
}

# ---------- HTTPS: panel administrativo ----------
server {
    listen 443 ssl;
    http2 on;
    server_name numi-g01.northcentralus.cloudapp.azure.com;

    ssl_certificate     /etc/letsencrypt/live/numi-g01.northcentralus.cloudapp.azure.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/numi-g01.northcentralus.cloudapp.azure.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy same-origin always;

    root /usr/share/nginx/admin;
    client_max_body_size 25m;

    location = / {
        return 302 /inicio.html;
    }

    # Páginas públicas (login y solicitud de cuenta)
    location = /index.html         { expires -1; try_files $uri =404; }
    location = /crear-usuario.html { expires -1; try_files $uri =404; }

    # Páginas privadas: antes de entregarlas Nginx pregunta al backend si hay sesión
    location ~ \.html$ {
        auth_request /_sesion;
        error_page 401 = @login;
        expires -1;
        try_files $uri =404;
    }

    # css/, js/, img/
    location / {
        try_files $uri =404;
    }

    # API y archivos subidos -> backend (Flask + Gunicorn)
    location /api/ {
        proxy_pass http://admin_api;
        include /etc/nginx/conf.d/proxy_headers.inc;
    }
    location /uploads/ {
        proxy_pass http://admin_api;
        include /etc/nginx/conf.d/proxy_headers.inc;
    }

    location = /_sesion {
        internal;
        proxy_pass http://admin_api/api/sesion;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        include /etc/nginx/conf.d/proxy_headers.inc;
    }

    location @login {
        return 302 /index.html;
    }
}

# ---------- HTTPS: panel docente ----------
server {
    listen 8443 ssl;
    http2 on;
    server_name numi-g01.northcentralus.cloudapp.azure.com;

    ssl_certificate     /etc/letsencrypt/live/numi-g01.northcentralus.cloudapp.azure.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/numi-g01.northcentralus.cloudapp.azure.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy same-origin always;

    root /usr/share/nginx/docente;
    client_max_body_size 25m;

    location = / {
        return 302 /panel.html;
    }

    location = /index.html { expires -1; try_files $uri =404; }

    location ~ \.html$ {
        auth_request /_sesion;
        error_page 401 = @login;
        expires -1;
        try_files $uri =404;
    }

    location / {
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://docente_api;
        include /etc/nginx/conf.d/proxy_headers.inc;
    }

    location = /_sesion {
        internal;
        proxy_pass http://docente_api/api/sesion;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        include /etc/nginx/conf.d/proxy_headers.inc;
    }

    location @login {
        return 302 /index.html;
    }
}
