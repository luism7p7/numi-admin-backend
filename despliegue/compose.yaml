# Numi en la VM de Azure: 4 repositorios + MySQL + Nginx (HTTPS con Let's Encrypt)
#
#   ~/numi/
#   ├── .env                      # secretos (chmod 600, no está en git)
#   ├── compose.yaml              # este archivo
#   ├── nginx/conf.d/numi.conf    # copia de despliegue/nginx/numi.conf
#   ├── certbot/                  # certificados y webroot de Let's Encrypt
#   └── repos/
#       ├── numi-admin-frontend     numi-admin-backend
#       └── numi-docente-frontend   numi-docente-backend
#
# Solo Nginx publica puertos. MySQL y los dos backends quedan en la red interna de Docker.
name: numi

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - numi_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 10s
      timeout: 5s
      retries: 12

  admin-backend:
    build: ./repos/numi-admin-backend
    image: numi-admin-backend:latest
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: ${MYSQL_DATABASE}
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      ADMIN_SECRET_KEY: ${ADMIN_SECRET_KEY}
      SESSION_COOKIE_SECURE: "1"
      APP_API_URL: ${APP_API_URL}
      UPLOADS_DIR: /uploads
    volumes:
      - numi_uploads:/uploads
    depends_on:
      mysql:
        condition: service_healthy
    expose:
      - "5000"

  docente-backend:
    build: ./repos/numi-docente-backend
    image: numi-docente-backend:latest
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: ${MYSQL_DATABASE}
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      DOCENTE_SECRET_KEY: ${DOCENTE_SECRET_KEY}
      SESSION_COOKIE_SECURE: "1"
      APP_API_URL: ${APP_API_URL}
      APP_API_KEY: ${APP_API_KEY}
      UPLOADS_DIR: /uploads
    volumes:
      - numi_uploads:/uploads:ro
    depends_on:
      mysql:
        condition: service_healthy
    expose:
      - "5001"

  # Servidor web: entrega los dos frontends y hace de proxy inverso hacia los backends
  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    depends_on:
      - admin-backend
      - docente-backend
    ports:
      - "80:80"       # solo redirige a HTTPS y atiende el reto de Let's Encrypt
      - "443:443"     # panel administrativo
      - "8080:8080"   # redirige al panel docente en HTTPS
      - "8443:8443"   # panel docente
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./repos/numi-admin-frontend:/usr/share/nginx/admin:ro
      - ./repos/numi-docente-frontend:/usr/share/nginx/docente:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro

  # Renovación del certificado:  docker compose run --rm certbot renew
  certbot:
    image: certbot/certbot
    profiles: ["certbot"]
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot

volumes:
  numi_mysql_data:
    external: true
  numi_uploads:
    external: true
